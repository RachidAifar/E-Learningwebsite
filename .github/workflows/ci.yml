name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Django API (PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: elearning
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: elearning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test main --verbosity 2

  frontend:
    name: React app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e-learning-front-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-learning-front-end/package-lock.json
      - run: npm ci
      - name: Run tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: true
      - name: Build
        # CI=false: existing lint warnings are reported but do not fail the build yet.
        run: npm run build
        env:
          CI: false
